# Overlay for compose.yaml. Development only: private network, loopback HTTP,
# separate project/volumes. Never put real user data in this reference instance.
services:
  db:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
  bootstrap:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
  migrate:
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
  kept:
    ports: !reset []
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    environment:
      KEPT_EMBEDDINGS: off
      KEPT_UPDATE_CHECK: 'false'
      KEPT_BARCODE_LOOKUP: 'false'
  preview:
    image: caddy@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    user: '1000:1000'
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    # The upstream Caddy binary carries this file capability, even on high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    command: [caddy, reverse-proxy, --from, ':8080', --to, 'http://kept:8080']
    ports: ['127.0.0.1:18740:8080']
    networks: [kept, preview]
    depends_on:
      kept:
        condition: service_healthy
networks:
  kept:
    internal: true
    ipam: !reset {}
  preview: {}
